<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found (404) | Sabro Networks (FTTH)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --sn-bg: #0b0f19;
            --sn-card: #111827;
            --sn-border: #1f2937;
            --sn-text: #f3f4f6;
            --sn-muted: #9ca3af;
            --sn-primary: #2563eb;
        }
        body {
            background-color: var(--sn-bg);
            color: var(--sn-text);
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 24px;
        }
        .error-card {
            background: var(--sn-card);
            border: 1px solid var(--sn-border);
            border-radius: 16px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
            max-width: 580px;
            width: 100%;
            padding: 40px 32px;
            text-align: center;
        }
        .logo-badge {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            background: rgba(37, 99, 235, 0.15);
            border: 2px solid rgba(37, 99, 235, 0.35);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #60a5fa;
            margin-bottom: 24px;
        }
        .error-code {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -2px;
            color: #60a5fa;
            line-height: 1;
            margin-bottom: 12px;
            font-family: 'JetBrains Mono', monospace;
        }
        .error-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: #ffffff;
        }
        .error-desc {
            color: var(--sn-muted);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .btn-brand-primary {
            background-color: var(--sn-primary);
            border: 1px solid var(--sn-primary);
            color: #ffffff;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 8px;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-brand-primary:hover {
            background-color: #1d4ed8;
            border-color: #1d4ed8;
            color: #ffffff;
            transform: translateY(-1px);
        }
        .btn-brand-secondary {
            background: #1f2937;
            border: 1px solid #374151;
            color: #e5e7eb;
            font-weight: 500;
            padding: 10px 18px;
            border-radius: 8px;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-brand-secondary:hover {
            background: #374151;
            color: #ffffff;
        }
        .footer-note {
            margin-top: 32px;
            padding-top: 20px;
            border-top: 1px solid var(--sn-border);
            font-size: 0.75rem;
            color: #6b7280;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="logo-badge">
            <i class="bi bi-compass"></i>
        </div>
        <div class="error-code">404</div>
        <div class="error-title">Endpoint Not Found</div>
        <p class="error-desc">
            The requested page or resource could not be located on the Sabro Networks portal. 
            Please verify the address or navigate back to the main management dashboard.
        </p>
        <div class="d-flex justify-content-center flex-wrap gap-2">
            <a href="/dashboard" class="btn-brand-primary">
                <i class="bi bi-speedometer2"></i> Main Dashboard
            </a>
            <a href="/login" class="btn-brand-secondary">
                <i class="bi bi-box-arrow-in-right"></i> Sign In
            </a>
        </div>
        <div class="footer-note">
            Sabro Networks (FTTH) &bull; Enterprise NOC Portal &bull; Powered by Vshatkay Solutions
        </div>
    </div>
</body>
</html>
