<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c130c" />
      <stop offset="100%" stop-color="#2b180d" />
    </linearGradient>
    <linearGradient id="fiberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdba74" />
      <stop offset="30%" stop-color="#f97316" />
      <stop offset="70%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="250" cy="250" r="236" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="12" />
  <circle cx="250" cy="250" r="216" fill="none" stroke="#ea580c" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="6 4" />

  <!-- Glowing Fiber Optical S Curves -->
  <g filter="url(#glow)">
    <!-- Main S Fiber Path 1 -->
    <path d="M 330 145 C 310 110 240 100 190 125 C 140 150 145 210 200 235 C 270 265 315 285 305 340 C 295 385 240 405 185 390 C 150 380 130 355 125 330" 
          fill="none" stroke="url(#fiberGrad)" stroke-width="14" stroke-linecap="round" />
    
    <!-- Secondary Fiber Path 2 -->
    <path d="M 350 160 C 335 125 260 115 210 135 C 165 155 165 205 215 230 C 285 260 330 280 320 335 C 310 375 255 395 205 380" 
          fill="none" stroke="#f97316" stroke-width="7" stroke-linecap="round" opacity="0.85" />
          
    <!-- Third Accent Fiber Path 3 -->
    <path d="M 310 135 C 290 115 240 110 200 130 C 160 150 160 190 200 215 C 265 245 300 270 290 320 C 280 360 235 375 195 365" 
          fill="none" stroke="#fed7aa" stroke-width="4" stroke-linecap="round" opacity="0.9" />

    <!-- Optical Core Nodes / Light Pulses -->
    <circle cx="330" cy="145" r="8" fill="#ffffff" filter="url(#glow)" />
    <circle cx="350" cy="160" r="6" fill="#fed7aa" />
    <circle cx="310" cy="135" r="5" fill="#f97316" />
    <circle cx="190" cy="125" r="6" fill="#ffffff" />
    <circle cx="200" cy="235" r="7" fill="#ffffff" />
    <circle cx="270" cy="265" r="6" fill="#fed7aa" />
    <circle cx="305" cy="340" r="7" fill="#ffffff" />
    <circle cx="185" cy="390" r="8" fill="#ffffff" filter="url(#glow)" />
    <circle cx="125" cy="330" r="6" fill="#f97316" />
  </g>

  <!-- High-Tech Signal Rays -->
  <line x1="330" y1="145" x2="365" y2="130" stroke="#f97316" stroke-width="3" stroke-linecap="round" opacity="0.7" />
  <line x1="350" y1="160" x2="385" y2="155" stroke="#fed7aa" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  <line x1="125" y1="330" x2="95" y2="340" stroke="#f97316" stroke-width="3" stroke-linecap="round" opacity="0.7" />
  <line x1="185" y1="390" x2="160" y2="415" stroke="#fed7aa" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
</svg>
