name: Sabro Networks CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Enterprise & Security Test Suite
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Initialize Test Database & Seeds
      run: |
        python init_db.py --reset

    - name: Execute Full Test Suite
      run: |
        python -m unittest test_security_suite.py test_enterprise_suite.py test_company_system.py
